name: yumquick
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^11.2.0
  flutter_spinkit: ^5.2.2
  flutter_svg: ^2.3.0
  freezed: ^4.0.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  json_annotation: ^4.12.0
  json_serializable: ^6.14.1
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.10.0
  retrofit_generator: ^10.2.11
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  adaptive_icon_background: "#F5CB58"
  adaptive_icon_foreground: "assets/images/splash-screen-+12.png"
  ios: true
  image_path: "assets/images/splash-screen-+12.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/splash-screen-+12.png"
    background_color: "#F5CB58"
    theme_color: "#F5CB58"
  windows:
    generate: true
    image_path: "assets/images/splash-screen-+12.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/splash-screen-+12.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    # fonts:
    #   - family: Schyler
    #     fonts:
    #       - asset: fonts/Schyler-Regular.ttf
    #       - asset: fonts/Schyler-Italic.ttf
    #         style: italic
