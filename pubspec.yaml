name: yumquick
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  adaptive_icon_background: "#F5CB58"
  adaptive_icon_foreground: "assets/images/splash-screen-+12.png"
  ios: true
  image_path: "assets/images/splash-screen-+12.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/splash-screen-+12.png"
    background_color: "#F5CB58"
    theme_color: "#F5CB58"
  windows:
    generate: true
    image_path: "assets/images/splash-screen-+12.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/splash-screen-+12.png"


flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/


